<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blast Converter | Selenium to Playwright</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Fira+Code:wght@400;500&display=swap"
        rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <style>
        :root {
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.4);
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border: rgba(148, 163, 184, 0.1);
            --text: #f8fafc;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Animated Background */
        .bg-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background: radial-gradient(circle at 50% 50%, #1e1b4b 0%, #0f172a 100%);
        }

        .header {
            padding: 2rem;
            text-align: center;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        h1 {
            margin: 0;
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #818cf8 0%, #c084fc 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.025em;
        }

        .main {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            padding: 2rem;
            max-width: 1600px;
            margin: 0 auto;
            width: calc(100% - 4rem);
        }

        .editor-container {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 1.5rem;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            backdrop-filter: blur(10px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .editor-container:hover {
            transform: translateY(-4px);
            box-shadow: 0 30px 60px -12px rgba(99, 102, 241, 0.15);
        }

        .editor-header {
            padding: 1rem 1.5rem;
            background: rgba(15, 23, 42, 0.5);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .lang-badge {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            background: rgba(99, 102, 241, 0.2);
            color: #818cf8;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        textarea,
        .preview {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text);
            font-family: 'Fira Code', monospace;
            font-size: 0.95rem;
            padding: 1.5rem;
            resize: none;
            outline: none;
            line-height: 1.6;
        }

        .preview {
            background: transparent !important;
            margin: 0 !important;
            white-space: pre-wrap;
            overflow-y: auto;
        }

        .convert-btn {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            padding: 1rem 2.5rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 9999px;
            font-family: 'Outfit', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 10px 25px -5px var(--primary-glow);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            z-index: 200;
        }

        .convert-btn:hover {
            transform: scale(1.05) translateY(-2px);
            box-shadow: 0 20px 35px -5px var(--primary-glow);
            background: #4f46e5;
        }

        .convert-btn:active {
            transform: scale(0.95);
        }

        .loader {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(148, 163, 184, 0.2);
        }
    </style>
</head>

<body>
    <div class="bg-glow"></div>
    <header class="header">
        <h1>Blast Converter</h1>
    </header>

    <main class="main">
        <div class="editor-container">
            <div class="editor-header">
                <span class="lang-badge">Selenium Java</span>
            </div>
            <textarea id="seleniumInput" placeholder="Paste your Selenium Java code here..."></textarea>
        </div>

        <div class="editor-container">
            <div class="editor-header">
                <span class="lang-badge">Playwright TypeScript</span>
            </div>
            <pre class="preview language-typescript"><code id="playwrightOutput"></code></pre>
        </div>
    </main>

    <button class="convert-btn" onclick="convertCode()">
        <span class="loader" id="loader"></span>
        <span>Convert Logic</span>
    </button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-typescript.min.js"></script>
    <script>
        async function convertCode() {
            const input = document.getElementById('seleniumInput').value;
            const outputElement = document.getElementById('playwrightOutput');
            const loader = document.getElementById('loader');

            if (!input.trim()) return;

            loader.style.display = 'block';
            outputElement.textContent = 'Converting...';
            Prism.highlightElement(outputElement);

            try {
                const response = await fetch('/convert', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: input })
                });

                const data = await response.json();
                outputElement.textContent = data.result || 'Error: ' + data.error;
            } catch (err) {
                outputElement.textContent = 'Failed to connect to server.';
            } finally {
                loader.style.display = 'none';
                Prism.highlightElement(outputElement);
            }
        }
    </script>
</body>

</html>
