<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selenium to Playwright - Report</title>
    <style>
        :root {
            --primary: #4f46e5;
            --success: #10b981;
            --warning: #f59e0b;
            --bg: #f8fafc;
            --text-main: #1e293b;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #e2e8f0;
        }

        .badge {
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            background: #d1fae5;
            color: #065f46;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 1.5rem;
        }

        pre {
            background: #1e293b;
            color: #f8fafc;
            padding: 1rem;
            border-radius: 8px;
            overflow-x: auto;
        }

        .stats {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-box {
            flex: 1;
            background: white;
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #e2e8f0;
        }

        .stat-val {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>Conversion Report</h1>
                <span class="badge">PROCESSED</span>
            </div>
            <div style="text-align: right;">
                <p><strong>Date:</strong> ${date}</p>
                <p><strong>Source:</strong> ${source_file}</p>
            </div>
        </div>

        <div class="stats">
            <div class="stat-box">
                <div class="stat-val">${methods_found}</div>
                <div>Java Methods</div>
            </div>
            <div class="stat-box">
                <div class="stat-val">${methods_converted}</div>
                <div>Converted</div>
            </div>
            <div class="stat-box">
                <div class="stat-val">${manual_reviews}</div>
                <div>Manual Checks</div>
            </div>
        </div>

        <div class="card">
            <h2>Output: ${output_file}</h2>
            <pre><code>${output_code}</code></pre>
        </div>
    </div>
</body>

</html>
